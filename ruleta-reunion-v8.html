<script>
  // --- Config / Estado ---
  const STORAGE_KEY = "ruleta_participantes_v3"; // se mantiene clave
  const STORAGE_DURACION = "ruleta_duracion_total";
  const DEFAULT_DURATION = "45";
  const DEFAULT_NAMES = []; // si querés nombres por defecto, agregalos aquí
  let ultimoSorteado = null;


  function uid(){ 
    try { return crypto && crypto.randomUUID ? crypto.randomUUID() : null; } 
    catch(e){} 
    return Date.now().toString(36)+Math.random().toString(36).slice(2,8); 
  }
  function cleanName(s){ return (s||"").trim(); }

  // participantes
  let participantes = [];
  let sorteadosSession = new Set();

  // ruleta
  let anguloActual = 0; let girando=false; let velocidad=0; let arc=2*Math.PI; const pointerAngle=-Math.PI/2;
  const canvas=document.getElementById("ruleta"); const ctx=canvas.getContext("2d"); const size=canvas.width, center=size/2;
  const outerMargin=50, pointerGap=6, pointerHalf=12;

  // cronómetro por participante
  let timerInterval=null; let segundos=0, minutos=0;
  const cronoDiv=document.getElementById("cronometro");
  const cronoNameSpan=document.getElementById("cronoName");
  const cronoTimeSpan=document.getElementById("cronoTime");

  // edición dialog
  const btnEdit=document.getElementById("btnEdit");
  const dlg=document.getElementById("dlgEditor");
  const btnCloseDlg=document.getElementById("btnCloseDlg");
  const participantListDiv=document.getElementById("participantList");
  const newNameInput=document.getElementById("newName");
  const newTimeInput=document.getElementById("newTime");
  const btnAdd=document.getElementById("btnAdd");
  const btnSave=document.getElementById("btnSave");
  const messages=document.getElementById("messages");
  const durInput=document.getElementById("durInput");
  const btnSaveDur=document.getElementById("btnSaveDur");

  // duración en minutos (persistida)
  let duracionMin = parseInt(localStorage.getItem(STORAGE_DURACION) || DEFAULT_DURATION);
  durInput.value = duracionMin;

  // reunión: arrancan al primer giro
  let meetingStarted = false;

  // --- Flip Clock (progresivo HH:MM) ---
  let globalSecs = 0;
  let flipClockInterval = null;
  function setDigit(digitElem, num){
    const current = digitElem.querySelector(".card.current");
    const next = digitElem.querySelector(".card.next");
    if (current.textContent !== num) {
      next.textContent = num;
      digitElem.classList.add("flip");
      setTimeout(() => {
        current.textContent = num;
        digitElem.classList.remove("flip");
      }, 600);
    }
  }
  function updateFlipClockFromSecs(secs){
    const hh = Math.floor(secs / 3600);
    const mm = Math.floor((secs % 3600) / 60);
    const str = String(hh).padStart(2,"0") + String(mm).padStart(2,"0"); // HHMM
    const digits = document.querySelectorAll("#flipClock .digit");
    str.split("").forEach((d,i)=> setDigit(digits[i], d));
  }
  function startFlipClock(){
    if (flipClockInterval) return;
    updateFlipClockFromSecs(globalSecs);
    flipClockInterval = setInterval(()=>{
      globalSecs++;
      updateFlipClockFromSecs(globalSecs);
    }, 1000);
  }

  // --- Batería Timer (regresiva) ---
  let batteryTotalSecs = duracionMin * 60;
  let batteryRemaining = batteryTotalSecs;
  const batteryLevel = document.getElementById("battery-level");
  const timerText = document.getElementById("timer-text");
  let batteryInterval = null;

  function applyBatteryColor(percent){
    if (percent > 50) {
      batteryLevel.style.backgroundColor = "limegreen";
    } else if (percent > 10) {
      batteryLevel.style.backgroundColor = "gold";
    } else {
      batteryLevel.style.backgroundColor = "red";
    }
  }
  function updateBatteryUI(){
    const percent = batteryTotalSecs > 0 ? (batteryRemaining / batteryTotalSecs) * 100 : 0;
    batteryLevel.style.height = Math.max(0, percent) + "%";
    applyBatteryColor(percent);
    const minutes = Math.floor(batteryRemaining / 60);
    const seconds = batteryRemaining % 60;
    timerText.textContent = `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
  }
  function startBatteryTimer(){
    if (batteryInterval) return;
    updateBatteryUI();
    batteryInterval = setInterval(()=>{
      if (batteryRemaining > 0){
        batteryRemaining--;
        updateBatteryUI();
      } else {
        clearInterval(batteryInterval);
        batteryInterval = null;
        batteryRemaining = 0;
        updateBatteryUI();
      }
    }, 1000);
  }

  // --- Storage / carga participantes (compatibilidad con versiones previas) ---
  function loadParticipantsFromStorage(){ 
    let raw=null; 
    try{ raw=localStorage.getItem(STORAGE_KEY);}catch(e){raw=null;} 
    if(!raw){ 
      participantes = DEFAULT_NAMES.map(n => ({ id: uid(), nombre: n, activo: true, tiempo: 5 }));
      return;
    } 
    try{ 
      const parsed=JSON.parse(raw); 
      if(!Array.isArray(parsed)) throw new Error("no-array"); 
      participantes = parsed.map(it => {
        // soporta formatos antiguos (string, objeto sin campos nuevos)
        if (typeof it === "string") {
          return { id: uid(), nombre: it, activo: true, tiempo: 5 };
        }
        const nombre = it.nombre || it.name || "";
        const id = it.id || uid();
        // mantener activo si viene explícito, sino true por defecto
        const activo = (typeof it.activo === "boolean") ? it.activo : true;
        // tiempo si viene (número), si viene como string, parsearlo; si no, default 5
        let tiempo = 5;
        if (typeof it.tiempo === "number" && Number.isFinite(it.tiempo)) tiempo = Math.max(1, Math.round(it.tiempo));
        else if (typeof it.tiempo === "string" && it.tiempo.trim() !== "") {
          const v = parseInt(it.tiempo);
          if (!isNaN(v) && v > 0) tiempo = v;
        }
        return { id, nombre, activo, tiempo };
      }).filter(p => cleanName(p.nombre).length > 0);
      if(participantes.length === 0) participantes = DEFAULT_NAMES.map(n => ({ id: uid(), nombre: n, activo: true, tiempo: 5 }));
    }catch(e){ 
      participantes = DEFAULT_NAMES.map(n => ({ id: uid(), nombre: n, activo: true, tiempo: 5 }));
    } 
  }

  function saveParticipantsToStorage(){ 
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(participantes));
      showMessage("Guardado correctamente.");
    }catch(e){ console.error(e); showMessage("No se pudo guardar: "+e,true); }
  }

  // --- UI editor ---
  function rebuildEditor(){
    participantListDiv.innerHTML = "";
    if (participantes.length === 0) {
      participantListDiv.innerHTML = '<div class="small">No hay participantes.</div>';
      return;
    }
    participantes.forEach((p, idx) => {
      const row = document.createElement("div");
      row.className = "p-item";

      // checkbox activo
      const chk = document.createElement("input");
      chk.type = "checkbox";
      chk.title = "Activo para sorteo";
      chk.checked = (typeof p.activo === "boolean") ? p.activo : true;
      chk.addEventListener("change", () => {
        participantes[idx].activo = chk.checked;
        saveParticipantsToStorage();
        actualizarGeometria();
        dibujarRuleta();
      });

      // name input
      const input = document.createElement("input");
      input.type = "text"; input.value = p.nombre;
      input.addEventListener("input", () => { participantes[idx].nombre = input.value; });

      // tiempo input (minutos)
      const timeInput = document.createElement("input");
      timeInput.type = "number";
      timeInput.min = "1";
      timeInput.value = (typeof p.tiempo === "number" && p.tiempo > 0) ? p.tiempo : 5;
      timeInput.title = "Tiempo estimado (min)";
      timeInput.style.width = "64px";
      timeInput.addEventListener("input", () => {
        const v = parseInt(timeInput.value);
        participantes[idx].tiempo = (isNaN(v) || v < 1) ? 1 : v;
      });

      // badge (sorteado)
      const badge = document.createElement("span"); badge.className = "badge";
      if (sorteadosSession.has(p.id)) badge.textContent = "(sorteado)";

      // delete button
      const btnDel = document.createElement("button"); btnDel.textContent = "-";
      btnDel.title = "Eliminar participante";
      btnDel.addEventListener("click", () => {
        if (!confirm(`Eliminar "${p.nombre}" de la lista?`)) return;
        participantes.splice(idx,1);
        saveParticipantsToStorage();
        rebuildEditor();
        actualizarGeometria();
        dibujarRuleta();
      });

      // append: checkbox, input, timeInput, badge, delete
      row.appendChild(chk);
      row.appendChild(input);
      row.appendChild(timeInput);
      row.appendChild(badge);
      row.appendChild(btnDel);

      participantListDiv.appendChild(row);
    });
  }
  function openEditor(){
    rebuildEditor();
    durInput.value = duracionMin;
    try { dlg.showModal(); } catch(e) { dlg.setAttribute("open",""); }
    newNameInput.focus();
  }
  function closeEditor(){ try{ dlg.close(); }catch(e){ dlg.removeAttribute("open"); } }
  btnEdit.addEventListener("click", openEditor);
  btnCloseDlg.addEventListener("click", closeEditor);
  dlg.addEventListener("cancel", ev => { ev.preventDefault(); closeEditor(); });

  const btnAddHandler = () => {
    const v = cleanName(newNameInput.value);
    const t = parseInt(newTimeInput.value || "5");
    if (!v) { showMessage("Ingresa un nombre.", true); return; }
    const tiempoVal = (!isNaN(t) && t > 0) ? t : 5;
    participantes.push({ id: uid(), nombre: v, activo: true, tiempo: tiempoVal });
    newNameInput.value = "";
    newTimeInput.value = "";
    saveParticipantsToStorage();
    rebuildEditor();
    actualizarGeometria();
    dibujarRuleta();
  };
  btnAdd.addEventListener("click", btnAddHandler);
  newNameInput.addEventListener("keydown", e => { if (e.key === "Enter") btnAddHandler(); });
  newTimeInput.addEventListener("keydown", e => { if (e.key === "Enter") btnAddHandler(); });

  btnSave.addEventListener("click", () => {
    // normalizar estructura
    participantes = participantes.map(p => ({
      id: p.id || uid(),
      nombre: cleanName(p.nombre),
      activo: (typeof p.activo === "boolean") ? p.activo : true,
      tiempo: (typeof p.tiempo === "number" && p.tiempo > 0) ? Math.max(1, Math.round(p.tiempo)) : 5
    })).filter(p => p.nombre.length > 0);
    saveParticipantsToStorage();
    rebuildEditor();
    actualizarGeometria();
    dibujarRuleta();
  });

  function showMessage(msg, isError=false){
    messages.textContent = msg;
    messages.style.color = isError ? "#f88" : "#8f8";
    setTimeout(() => { messages.textContent = ""; }, 2000);
  }

  // --- geometría y dibujo ruleta ---
  function activos(){ return participantes.filter(p => p.activo && !sorteadosSession.has(p.id)); }
  function actualizarGeometria(){ const n=Math.max(1, activos().length); arc=2*Math.PI/n; }
  function normalizar(a){ a=a%(2*Math.PI); return (a+2*Math.PI)%(2*Math.PI); }
  function colorDeSector(i,n){ const h=Math.round((360*i)/Math.max(1,n)); return `hsl(${h} 80% 60%)`; }

  function dibujarRuleta(){
    ctx.clearRect(0,0,size,size);
    const activosList = activos();
    const r = center - outerMargin;
    const topY = center - r;

    if (activosList.length === 0) {
      ctx.beginPath(); ctx.arc(center, center, r, 0, 2*Math.PI); ctx.fillStyle = "#eee"; ctx.fill();
      ctx.fillStyle = "#111"; ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
      ctx.fillText("No hay participantes por sortear", center, center);
    } else {
      activosList.forEach((p,i) => {
        const inicio = anguloActual + i * arc;
        const fin = inicio + arc;
        ctx.beginPath(); ctx.moveTo(center, center);
        ctx.arc(center, center, r, inicio, fin, false);
        ctx.closePath();
        ctx.fillStyle = colorDeSector(i, activosList.length);
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,.15)"; ctx.lineWidth = 2; ctx.stroke();

        ctx.save(); ctx.translate(center, center); ctx.rotate(inicio + arc/2);
        ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillStyle = "#111"; ctx.font = "bold 24px Arial";
        ctx.fillText(p.nombre, r - 18, 0);
        ctx.restore();
      });
    }

    // flecha roja
    ctx.beginPath();
    ctx.moveTo(center - pointerHalf, topY - pointerGap - 24);
    ctx.lineTo(center + pointerHalf, topY - pointerGap - 24);
    ctx.lineTo(center, topY - pointerGap);
    ctx.closePath(); ctx.fillStyle = "#ff0000"; ctx.fill();

    // borde
    ctx.beginPath(); ctx.arc(center, center, r, 0, 2*Math.PI);
    ctx.lineWidth = 6; ctx.strokeStyle = "#222"; ctx.stroke();
  }

  function indiceSeleccionadoPorFlecha(){
    const activosList = activos();
    if (activosList.length === 0) return -1;
    const relativo = normalizar(pointerAngle - anguloActual);
    const idx = Math.floor((relativo + 1e-9) / arc) % activosList.length;
    return idx;
  }

  // --- cronómetro por ganador ---
  function resetCrono(){ 
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } 
    segundos=0; minutos=0; 
    cronoDiv.style.display = "none"; 
    cronoNameSpan.textContent = "";
    cronoTimeSpan.textContent = "00:00";
    cronoTimeSpan.classList.remove("crono-yellow","crono-red");
    cronoDiv.classList.remove("crono-yellow","crono-red");
  }
  function startCronoFor(participant){ 
    if (!participant) return;
    if (timerInterval) clearInterval(timerInterval); 
    segundos=0; minutos=0; 
    cronoNameSpan.textContent = participant.nombre || "";
    cronoTimeSpan.textContent = "00:00";
    cronoTimeSpan.classList.remove("crono-yellow","crono-red");
    cronoDiv.classList.remove("crono-yellow","crono-red");
    cronoDiv.style.display = "block"; 
    // mostrar también el tiempo estimado (opcional; aquí se deja en title)
    cronoDiv.title = "Tiempo estimado: " + (participant.tiempo || "N/A") + " min";
    const totalSegs = (typeof participant.tiempo === "number" && participant.tiempo > 0) ? participant.tiempo * 60 : null;

    timerInterval = setInterval(() => { 
      segundos++; 
      if (segundos === 60) { segundos = 0; minutos++; } 
      const formato = (minutos < 10 ? "0"+minutos : minutos) + ":" + (segundos < 10 ? "0"+segundos : segundos); 
      cronoTimeSpan.textContent = formato;

      // colores según % del tiempo estimado: 50% -> amarillo, 90% -> rojo
      if (totalSegs) {
        const elapsed = minutos*60 + segundos;
        const pct = elapsed / totalSegs;
        cronoTimeSpan.classList.remove("crono-yellow","crono-red");
        cronoDiv.classList.remove("crono-yellow","crono-red");
        if (pct >= 0.9) {
          cronoTimeSpan.classList.add("crono-red");
          cronoDiv.classList.add("crono-red");
        } else if (pct >= 0.5) {
          cronoTimeSpan.classList.add("crono-yellow");
          cronoDiv.classList.add("crono-yellow");
        } else {
          // default color (heredado)
        }
      }
    }, 1000); 
  }

  // --- giro / mostrar ganador ---
  function girarRuleta(){
    const activosList = activos();
    if (girando) return;
    if (activosList.length === 0) { dibujarRuleta(); return; }

    // Primer giro: arranca FlipClock + Batería
    if (!meetingStarted) {
      meetingStarted = true;
      // sincronizar duración/batería
      batteryTotalSecs = duracionMin * 60;
      batteryRemaining = batteryTotalSecs;
      updateBatteryUI();
      startBatteryTimer();
      startFlipClock();
    }

    resetCrono();
    velocidad = Math.random() * 0.22 + 0.28;
    girando = true;
    requestAnimationFrame(actualizar);
  }

  function mostrarGanador(){
    const activosList = activos();
    const idx = indiceSeleccionadoPorFlecha();
    if (idx < 0 || idx >= activosList.length) return;
    const ganador = activosList[idx];
    sorteadosSession.add(ganador.id);
    // arrancar cronómetro con el objeto ganador (para acceder a su tiempo estimado)
    startCronoFor(ganador);
    rebuildEditor();
    actualizarGeometria();
    dibujarRuleta();
  }

  function actualizar(){
    if (!girando) return;
    anguloActual += velocidad;
    velocidad *= 0.985;
    if (Math.abs(velocidad) < 0.003) {
      girando = false;
      velocidad = 0;
      mostrarGanador();
      return;
    }
    dibujarRuleta();
    requestAnimationFrame(actualizar);
  }

  // Interacciones canvas (cursor y click sobre flecha)
  canvas.addEventListener("mousemove", function(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / canvas.clientWidth;
    const scaleY = canvas.height / canvas.clientHeight;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
    
    const r = center - outerMargin;
    const topY = center - r;
    const triX1 = center - pointerHalf, triY1 = topY - pointerGap - 24;
    const triX2 = center + pointerHalf, triY2 = topY - pointerGap - 24;
    const triY3 = topY - pointerGap;
    if (x >= triX1 && x <= triX2 && y >= triY1 && y <= triY3) canvas.style.cursor = "pointer";
    else canvas.style.cursor = "default";
  });
  canvas.addEventListener("click", function(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / canvas.clientWidth;
    const scaleY = canvas.height / canvas.clientHeight;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
     
    const r = center - outerMargin;
    const topY = center - r;
    const triX1 = center - pointerHalf, triY1 = topY - pointerGap - 24;
    const triX2 = center + pointerHalf, triY2 = topY - pointerGap - 24;
    const triY3 = topY - pointerGap;
    if (x >= triX1 && x <= triX2 && y >= triY1 && y <= triY3) { girarRuleta(); }
  });

  // --- duración / storage ---
  btnSaveDur.addEventListener("click", ()=>{
    const v = parseInt(durInput.value || DEFAULT_DURATION);
    if (isNaN(v) || v < 1) { showMessage("Duración inválida", true); return; }
    duracionMin = v;
    localStorage.setItem(STORAGE_DURACION, duracionMin);
    // Si la reunión aún no empezó, actualizo la batería inicial mostrada
    if (!meetingStarted) {
      batteryTotalSecs = duracionMin * 60;
      batteryRemaining = batteryTotalSecs;
      updateBatteryUI();
    }
    showMessage("Duración guardada: " + duracionMin + " min");
  });

  window.addEventListener("storage", (e) => {
    if (e.key === STORAGE_KEY) {
      loadParticipantsFromStorage();
      sorteadosSession = new Set();
      rebuildEditor();
      actualizarGeometria();
      dibujarRuleta();
    } else if (e.key === STORAGE_DURACION) {
      duracionMin = parseInt(localStorage.getItem(STORAGE_DURACION) || DEFAULT_DURATION);
      durInput.value = duracionMin;
      if (!meetingStarted) {
        batteryTotalSecs = duracionMin * 60;
        batteryRemaining = batteryTotalSecs;
        updateBatteryUI();
      }
    }
  });

  // Init
  loadParticipantsFromStorage();
  sorteadosSession = new Set();
  // ensure structure is normalized and saved
  participantes = participantes.map(p => ({
    id: p.id || uid(),
    nombre: cleanName(p.nombre),
    activo: (typeof p.activo === "boolean") ? p.activo : true,
    tiempo: (typeof p.tiempo === "number" && p.tiempo > 0) ? Math.max(1, Math.round(p.tiempo)) : 5
  }));
  saveParticipantsToStorage();

  actualizarGeometria();
  dibujarRuleta();
  updateBatteryUI(); // mostrar carga inicial según duración
  // Flip Clock se mantiene en 00:00 (HH:MM) hasta que empiece la reunión
  updateFlipClockFromSecs(0);
</script>
