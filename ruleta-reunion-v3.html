<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Ruleta de Turnos</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body { font-family: Arial, system-ui, sans-serif; text-align:center; margin:0; padding:20px; background:#2E2F38; color:#eee; }
  h1 { margin:0 0 8px; }
  
  #ruletaContainer { display:inline-block; position:relative; }
  
  canvas { background:#fff; border-radius:50%; box-shadow:0 0 12px rgba(0,0,0,.12) inset; }
  
  .overlay { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; font-size:20px; font-weight:bold; background:#2E2F38; padding:6px 10px; border-radius:10px; display:none; color:#fff; text-align:center; }
  
  button { padding:6px 12px; margin:4px; font-size:14px; border-radius:5px; border:0; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.12); background:#666; color:#fff; }
  
  button.icon-btn { background:transparent; box-shadow:none; padding:4px; border-radius:6px; cursor:pointer;}
  
  dialog { border-radius:8px; border:none; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  
  .dialog-content { padding:14px; width:420px; background:#1f2026; color:#eee; }
  
  .dialog-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  
  .p-item { display:flex; gap:8px; align-items:center; margin-bottom:3px; }
  
  .p-item input { flex:1; padding:4px 6px; border-radius:6px; border:1px solid rgba(255,255,255,.06); background:rgba(255,255,255,0.02); color:#fff; }
  
  .small { font-size:12px; color:#bbb; }
  
  .badge { font-size:12px; color:#bbb; margin-left:6px; }
  
  #participantList { max-height:260px; overflow:auto; margin-bottom:3px; }
  
  #messages { height:18px; margin-top:6px; font-size:13px; color:#8f8; }
  
  label { font-size:14px; margin-right:8px; }
  
  input[type="number"] { padding:6px; border-radius:6px; border:1px solid rgba(255,255,255,.08); width:80px; background:rgba(255,255,255,0.02); color:#fff; }
  /* ID: 20250926-1034.2 */
  #battery-container {
    font-family: Arial, sans-serif;
    text-align: center;
    width: 100px;        /* ancho fijo */
    height: 500px;       /* mismo alto que la ruleta */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  #battery {
    width: 60px;
    height: 200px;
    border: 3px solid #333;
    border-radius: 6px;
    position: relative;
    background: #eee;
    display: flex;
    flex-direction: column-reverse;
    overflow: hidden;
  }

  #battery::after {
    content: "";
    position: absolute;
    top: -12px;
    left: 18px;
    width: 24px;
    height: 10px;
    background: #333;
    border-radius: 2px;
  }

  #battery-level {
    width: 100%;
    height: 100%;
    background-color: limegreen;
    transition: height 1s linear, background-color 0.5s;
  }

  #timer-text {
    margin-top: 12px;
    font-size: 18px;
    color: #fff;
}

</style>
</head>
  <body>

  <h1 style="display:flex;justify-content:center;align-items:center;gap:12px;">
    Ruleta de Turnos
    <button id="btnEdit" class="icon-btn" title="Editar participantes y duración" aria-label="Editar participantes y duración">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" >
        <g id="Setting_Gear" data-name="Setting Gear">
          <!-- engranaje principal -->
          <path fill="#888888" d="M64 28v8a4 4 0 0 1-4.26 4h-1.59a2 2 0 0 0-1.85 1.27c-.18.45-.36.9-.56 1.35a2 2 0 0 0 .41 2.21l1.31 1.31a4 4 0 0 1 0 5.66l-5.66 5.66a4 4 0 0 1-5.66 0l-2.31-2.31a24.79 24.79 0 0 1-2.57 1.15A2 2 0 0 0 40 58.15V60a4 4 0 0 1-4 4h-8a4 4 0 0 1-4-4.26v-1.59a2 2 0 0 0-1.27-1.85c-.45-.18-.9-.36-1.35-.56a2 2 0 0 0-2.21.41l-1.31 1.31a4 4 0 0 1-5.66 0L6.54 51.8a4 4 0 0 1 0-5.66l1.31-1.31a2 2 0 0 0 .41-2.21c-.2-.45-.38-.9-.56-1.35A2 2 0 0 0 5.85 40H4a4 4 0 0 1-4-4v-8a4 4 0 0 1 4.26-4h1.59a2 2 0 0 0 1.85-1.27c.18-.45.36-.9.56-1.35a2 2 0 0 0-.41-2.21l-1.31-1.31a4 4 0 0 1 0-5.66l5.66-5.66a4 4 0 0 1 5.66 0l1.31 1.31a2 2 0 0 0 2.21.41c.45-.2.9-.38 1.35-.56A2 2 0 0 0 24 5.85V4a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4.26v1.59a2 2 0 0 0 1.27 1.85c.45.18.9.36 1.35.56a2 2 0 0 0 2.21-.41l1.31-1.31a4 4 0 0 1 5.66 0l5.66 5.66a4 4 0 0 1 0 5.66l-1.31 1.31a2 2 0 0 0-.41 2.21c.2.45.38.9.56 1.35A2 2 0 0 0 58.15 24H60a4 4 0 0 1 4 4z"/>
          <!-- detalles claros -->
          <path fill="#cccccc" d="M62 57a5 5 0 0 1-8.45 3.62L32.71 39.78l7.07-7.07 20.67 20.67A5 5 0 0 1 62 57z"/>
          <path fill="#cccccc" d="M36.18 43.25a12 12 0 0 1-15-16.43l8 8 4.24-1.42 1.42-4.24-8-8a12 12 0 0 1 16.43 15"/>
          <!-- detalles oscuros -->
          <path fill="#555555" d="M60 24c-1.64 0-3.12.27-3.7-1.26-.18-.46-.37-.93-.57-1.36a2 2 0 0 1 .41-2.22l1.31-1.31a4 4 0 0 0 0-5.64l-5.66-5.66a4 4 0 0 0-5.64 0l-1.32 1.31a2 2 0 0 1-2.19.41c-2.31-1.06-2.64-.53-2.64-4A4.05 4.05 0 0 0 36 0h-8a4 4 0 0 0-4 4c0 1.64.27 3.12-1.26 3.7-.46.18-.93.37-1.36.57a2 2 0 0 1-2.22-.41l-1.31-1.31a4 4 0 0 0-5.64 0l-5.66 5.66a4 4 0 0 0 0 5.64l1.31 1.32a2 2 0 0 1 .41 2.19c-1.06 2.31-.53 2.64-4 2.64A4.05 4.05 0 0 0 0 28v8a4 4 0 0 0 4 4c1.64 0 3.12-.27 3.7 1.26.18.46.37.93.57 1.36a2 2 0 0 1-.41 2.22l-1.31 1.31a4 4 0 0 0 0 5.64l5.66 5.66a4 4 0 0 0 5.64 0l1.32-1.31a2 2 0 0 1 2.19-.41c2.31 1.06 2.64.53 2.64 4A4.05 4.05 0 0 0 28 64h8a4 4 0 0 0 4-4 8.06 8.06 0 0 1 .14-2.6 2 2 0 1 0-3.72-1.46A9.81 9.81 0 0 0 36 60h-7.94a6.82 6.82 0 0 1-.06-1.85 6 6 0 0 0-3.84-5.59c-.37-.14-.75-.3-1.14-.47a6 6 0 0 0-6.68 1.23L15 54.63 9.37 49l1.31-1.3a6 6 0 0 0 1.23-6.7c-.17-.37-.33-.75-.47-1.13A6 6 0 0 0 5.85 36H4v-7.94A6.82 6.82 0 0 1 5.85 28a6 6 0 0 0 5.59-3.84c.14-.37.3-.75.47-1.14a6 6 0 0 0-1.23-6.68L9.37 15 15 9.37l1.3 1.31a6 6 0 0 0 6.7 1.23c.37-.17.75-.33 1.13-.47A6 6 0 0 0 28 5.85V4h7.94A6.82 6.82 0 0 1 36 5.85a6 6 0 0 0 3.84 5.59c.37.14.75.3 1.14.47a6 6 0 0 0 6.68-1.23L49 9.37 54.63 15l-1.31 1.3a6 6 0 0 0-1.23 6.7c.17.37.33.75.47 1.13A6 6 0 0 0 58.15 28H60v7.94c-.24.21-2.28-.24-4.1.48a2 2 0 1 0 1.46 3.72 6.4 6.4 0 0 1 2.37-.14A4.05 4.05 0 0 0 64 36v-8a4 4 0 0 0-4-4z"/>
        </g>
      </svg>
    </button>
  </h1>

  <div style="margin-bottom:10px;">
    <span id="globalTimer">Global: 00:00</span>
  </div>

  <!-- ID: 20250926-1034.1 -->
  <div style="display:flex; justify-content:center; align-items:center; gap:20px;">
    
    <!-- Batería -->
    <div id="battery-container">
      <div id="battery">
        <div id="battery-level"></div>
      </div>
      <div id="timer-text"></div>
    </div>

    <!-- Ruleta -->
    <div id="ruletaContainer">
      <canvas id="ruleta" width="500" height="500" role="button" aria-label="Ruleta - hacer clic en el triángulo rojo para girar"></canvas>
      <div id="cronometro" class="overlay">00:00</div>
    </div>
  </div>

  <!-- Dialog para edición: participantes + duración -->
  <dialog id="dlgEditor" aria-labelledby="dlgTitle">
    <div class="dialog-content">
      <div class="dialog-header">
        <strong id="dlgTitle">Editar reunión</strong>
        <div><button id="btnCloseDlg">X</button></div>
      </div>

      <div style="margin-bottom:8px; display:flex; align-items:center; gap:8px;">
        <label for="durInput">Duración total (min):</label>
        <input id="durInput" type="number" min="1" value="120"/>
        <button id="btnSaveDur">Guardar duración</button>
      </div>

      <div class="dialog-header">
        <strong>Editar participantes</strong>
      </div>
      <div id="participantList"></div>

      <div style="display:flex; gap:8px; margin-top:8px;">
        <input id="newName" placeholder="Nuevo participante" />
        <button id="btnAdd">+</button>
        <button id="btnSave">Guardar participantes</button>
      </div>

      <div style="margin-top:10px;">
      </div>

      <div id="messages"></div>
    </div>
  </dialog>

  <script>
    // --- Config / Estado ---
    const STORAGE_KEY = "ruleta_participantes_v3";
    const STORAGE_DURACION = "ruleta_duracion_total";
    const DEFAULT_DURATION = "45";
    const DEFAULT_NAMES = [];
    function uid(){ 
      try { 
        return crypto && crypto.randomUUID ? crypto.randomUUID() : null; 
      } catch(e){} 
      return Date.now().toString(36)+Math.random().toString(36).slice(2,8); 
    }
    function cleanName(s){ 
      return (s||"").trim(); 
    }

    // participantes
    let participantes = [];
    let sorteadosSession = new Set();

    // ruleta
    let anguloActual = 0; let girando=false; let velocidad=0; let arc=2*Math.PI; const pointerAngle=-Math.PI/2;
    const canvas=document.getElementById("ruleta"); const ctx=canvas.getContext("2d"); const size=canvas.width, center=size/2;
    const outerMargin=50, pointerGap=6, pointerHalf=12;

    // cronómetro por participante
    let timerInterval=null; let segundos=0, minutos=0;
    const cronoDiv=document.getElementById("cronometro");

    // edición dialog
    const btnEdit=document.getElementById("btnEdit");
    const dlg=document.getElementById("dlgEditor");
    const btnCloseDlg=document.getElementById("btnCloseDlg");
    const participantListDiv=document.getElementById("participantList");
    const newNameInput=document.getElementById("newName");
    const btnAdd=document.getElementById("btnAdd");
    const btnSave=document.getElementById("btnSave");
    const messages=document.getElementById("messages");
    const durInput=document.getElementById("durInput");
    const btnSaveDur=document.getElementById("btnSaveDur");

    // duración en minutos (persistida)
    let duracionMin = parseInt(localStorage.getItem(STORAGE_DURACION) || DEFAULT_DURATION);
    durInput.value = duracionMin;

    // reunión: timers que arrancan al primer giro
    let meetingStarted = false;
    let globalSecs = 0;
    let totalSecs = duracionMin * 60;
    let globalInterval = null;
    let totalInterval = null;

    // --- storage load/save ---
    function loadParticipantsFromStorage(){ let raw=null; try{ raw=localStorage.getItem(STORAGE_KEY);}catch(e){raw=null;} if(!raw){participantes=DEFAULT_NAMES.map(n=>({id:uid(),nombre:n})); return;} try{ const parsed=JSON.parse(raw); if(!Array.isArray(parsed)) throw new Error("no-array"); participantes=parsed.map(it=>{ if(typeof it==="string") return {id:uid(),nombre:it}; const nombre=it.nombre||it.name||""; return {id:it.id||uid(),nombre}; }).filter(p=>cleanName(p.nombre).length>0); if(participantes.length===0) participantes=DEFAULT_NAMES.map(n=>({id:uid(),nombre:n})); }catch(e){ participantes=DEFAULT_NAMES.map(n=>({id:uid(),nombre:n})); } }

    function saveParticipantsToStorage(){ 
      try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(participantes)); 
      showMessage("Guardado correctamente."); 
      }catch(e){ 
        console.error(e); showMessage("No se pudo guardar: "+e,true);
      } 
    }

    // guardar duración desde diálogo
    btnSaveDur.addEventListener("click", ()=>{
      const v = parseInt(durInput.value || DEFAULT_DURATION);
      if (isNaN(v) || v < 1) { showMessage("Duración inválida", true); return; }
      duracionMin = v;
      localStorage.setItem(STORAGE_DURACION, duracionMin);
      totalSecs = duracionMin * 60;
      showMessage("Duración guardada: " + duracionMin + " min");
    });

    // --- UI editor ---
    function rebuildEditor(){
      participantListDiv.innerHTML = "";
      if (participantes.length === 0) {
        participantListDiv.innerHTML = '<div class="small">No hay participantes.</div>';
        return;
      }
      participantes.forEach((p, idx) => {
        const row = document.createElement("div");
        row.className = "p-item";
        const input = document.createElement("input");
        input.type = "text"; input.value = p.nombre;
        input.addEventListener("input", () => { participantes[idx].nombre = input.value; });
        const badge = document.createElement("span"); badge.className = "badge";
        if (sorteadosSession.has(p.id)) badge.textContent = "(sorteado)";
        const btnDel = document.createElement("button"); btnDel.textContent = "-";
        btnDel.addEventListener("click", () => {
          if (!confirm(`Eliminar "${p.nombre}" de la lista?`)) return;
          participantes.splice(idx,1);
          saveParticipantsToStorage();
          rebuildEditor();
          actualizarGeometria();
          dibujarRuleta();
        });
        row.appendChild(input); row.appendChild(badge); row.appendChild(btnDel);
        participantListDiv.appendChild(row);
      });
    }

    function openEditor(){
      rebuildEditor();
      durInput.value = duracionMin;
      try { dlg.showModal(); } catch(e) { dlg.setAttribute("open",""); }
      newNameInput.focus();
    }
    function closeEditor(){ try{ dlg.close(); }catch(e){ dlg.removeAttribute("open"); } }
    btnEdit.addEventListener("click", openEditor);
    btnCloseDlg.addEventListener("click", closeEditor);
    dlg.addEventListener("cancel", ev => { ev.preventDefault(); closeEditor(); });

    btnAdd.addEventListener("click", () => {
      const v = cleanName(newNameInput.value);
      if (!v) { showMessage("Ingresa un nombre.", true); return; }
      participantes.push({ id: uid(), nombre: v });
      newNameInput.value = "";
      saveParticipantsToStorage();
      rebuildEditor();
      actualizarGeometria();
      dibujarRuleta();
    });
    newNameInput.addEventListener("keydown", e => { if (e.key === "Enter") btnAdd.click(); });

    btnSave.addEventListener("click", () => {
      participantes = participantes.map(p => ({ id: p.id || uid(), nombre: cleanName(p.nombre) })).filter(p => p.nombre.length > 0);
      saveParticipantsToStorage();
      rebuildEditor();
      actualizarGeometria();
      dibujarRuleta();
      //closeEditor();
    });

    function showMessage(msg, isError=false){
      messages.textContent = msg;
      messages.style.color = isError ? "#f88" : "#8f8";
      setTimeout(() => { messages.textContent = ""; }, 2000);
    }

    // --- geometría y dibujo ruleta ---
    function actualizarGeometria(){ const n=Math.max(1, activos().length); arc=2*Math.PI/n; }
    function normalizar(a){ a=a%(2*Math.PI); return (a+2*Math.PI)%(2*Math.PI); }
    function colorDeSector(i,n){ const h=Math.round((360*i)/Math.max(1,n)); return `hsl(${h} 80% 60%)`; }
    function dibujarRuleta(){
      ctx.clearRect(0,0,size,size);
      const activosList = activos();
      const r = center - outerMargin;
      const topY = center - r;

      if (activosList.length === 0) {
        ctx.beginPath(); ctx.arc(center, center, r, 0, 2*Math.PI); ctx.fillStyle = "#eee"; ctx.fill();
        ctx.fillStyle = "#111"; ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
        ctx.fillText("No hay participantes por sortear", center, center);
      } else {
        activosList.forEach((p,i) => {
          const inicio = anguloActual + i * arc;
          const fin = inicio + arc;
          ctx.beginPath(); ctx.moveTo(center, center);
          ctx.arc(center, center, r, inicio, fin, false);
          ctx.closePath();
          ctx.fillStyle = colorDeSector(i, activosList.length);
          ctx.fill();
          ctx.strokeStyle = "rgba(0,0,0,.15)"; ctx.lineWidth = 2; ctx.stroke();

          ctx.save(); ctx.translate(center, center); ctx.rotate(inicio + arc/2);
          ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.fillStyle = "#111"; ctx.font = "bold 14px Arial";
          ctx.fillText(p.nombre, r - 18, 0);
          ctx.restore();
        });
      }

      // flecha (fiel) roja - clickable
      ctx.beginPath();
      ctx.moveTo(center - pointerHalf, topY - pointerGap - 24);
      ctx.lineTo(center + pointerHalf, topY - pointerGap - 24);
      ctx.lineTo(center, topY - pointerGap);
      ctx.closePath(); ctx.fillStyle = "#ff0000"; ctx.fill();

      // borde
      ctx.beginPath(); ctx.arc(center, center, r, 0, 2*Math.PI);
      ctx.lineWidth = 6; ctx.strokeStyle = "#222"; ctx.stroke();
    }

    // devuelve índice seleccionado por la flecha
    function indiceSeleccionadoPorFlecha(){
      const activosList = activos();
      if (activosList.length === 0) 
        return -1;
      const relativo = normalizar(pointerAngle - anguloActual);
      const idx = Math.floor((relativo + 1e-9) / arc) % activosList.length;
      return idx;
    }

    // --- cronómetro por ganador ---
    function resetCrono(){ 
      if (timerInterval) { 
        clearInterval(timerInterval); 
        timerInterval = null; 
      } 
      segundos=0; 
      minutos=0; 
      cronoDiv.style.display = "none"; 
      cronoDiv.innerHTML = ""; 
    }
    
    function startCronoFor(name){ 
      if (timerInterval) 
        clearInterval(timerInterval); 
      segundos=0; 
      minutos=0; 
      cronoDiv.innerHTML = name + "<br/>00:00"; 
      cronoDiv.style.display = "block"; 
      timerInterval = setInterval(() => { 
        segundos++; 
        if (segundos === 60) { 
          segundos = 0; minutos++; 
        } 
        const formato = (minutos < 10 ? "0"+minutos : minutos) + ":" + (segundos < 10 ? "0"+segundos : segundos); 
        cronoDiv.innerHTML = name + "<br/>" + formato; 
      }, 1000); 
    }

    // --- giro / mostrar ganador ---
    function girarRuleta(){
      const activosList = activos();
      if (girando) 
        return;
      if (activosList.length === 0) {
        dibujarRuleta();
        return;
      }

      if (!meetingStarted) {
        startTimers();
        meetingStarted = true;
      }

      resetCrono();
      velocidad = Math.random() * 0.22 + 0.28;
      girando = true;
      requestAnimationFrame(actualizar);
    }

    function mostrarGanador(){
      const activosList = activos();
      const idx = indiceSeleccionadoPorFlecha();
      if (idx < 0 || idx >= activosList.length) {
        return;
      }
      const ganador = activosList[idx];
      sorteadosSession.add(ganador.id);
      startCronoFor(ganador.nombre);
      rebuildEditor();
      actualizarGeometria();
      dibujarRuleta();
    }

    function actualizar(){
      if (!girando) 
        return;
      anguloActual += velocidad;
      velocidad *= 0.985;
      if (Math.abs(velocidad) < 0.003) {
        girando = false;
        velocidad = 0;
        mostrarGanador();
        return;
      }
      dibujarRuleta();
      requestAnimationFrame(actualizar);
    }
    // activo el cursor tipo POINTER si el mouse pasa encima de la flechita roja 'fiel'
    canvas.addEventListener("mousemove", function(e){
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const r = center - outerMargin;
      const topY = center - r;

      const triX1 = center - pointerHalf, triY1 = topY - pointerGap - 24;
      const triX2 = center + pointerHalf, triY2 = topY - pointerGap - 24;
      const triY3 = topY - pointerGap;

      if (x >= triX1 && x <= triX2 && y >= triY1 && y <= triY3) {
        canvas.style.cursor = "pointer";
      } else {
        canvas.style.cursor = "default";
      }
    });
    // clic en fiel detecta bounding-box del triángulo
    canvas.addEventListener("click", function(e){
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const r = center - outerMargin;
      const topY = center - r;
      const triX1 = center - pointerHalf, triY1 = topY - pointerGap - 24;
      const triX2 = center + pointerHalf, triY2 = topY - pointerGap - 24;
      const triY3 = topY - pointerGap;
      if (x >= triX1 && x <= triX2 && y >= triY1 && y <= triY3) {
        girarRuleta();
      }
    });

    // --- timers global y total (se inician con startTimers) ---
    function startTimers(){
      // proteger inicios múltiples
      if (globalInterval || totalInterval) 
        return;
      globalSecs = 0;
      totalSecs = duracionMin * 60;
      document.getElementById("globalTimer").textContent = "Global: 00:00";
      document.getElementById("totalTimer").textContent = "Total restante: " + String(duracionMin).padStart(2,"0") + ":00";

      globalInterval = setInterval(() => {
        globalSecs++;
        const m = String(Math.floor(globalSecs/60)).padStart(2,"0");
        const s = String(globalSecs%60).padStart(2,"0");
        document.getElementById("globalTimer").textContent = "Global: " + m + ":" + s;
      }, 1000);

      totalInterval = setInterval(() => {
        if (totalSecs > 0) 
          totalSecs--;
        const m = String(Math.floor(totalSecs/60)).padStart(2,"0");
        const s = String(totalSecs%60).padStart(2,"0");
        document.getElementById("totalTimer").textContent = "Total restante: " + m + ":" + s;
        if (totalSecs === 0) {
          // aviso visual simple
          document.getElementById("totalTimer").style.color = "#f88";
          clearInterval(totalInterval); totalInterval = null;
        }
      }, 1000);
    }

    // --- util y storage listeners ---
    function activos(){ 
      return participantes.filter(p => !sorteadosSession.has(p.id)); 
    }

    loadParticipantsFromStorage = loadParticipantsFromStorage || loadParticipantsFromStorage;
    loadParticipantsFromStorage();
    sorteadosSession = new Set();
    actualizarGeometria();
    dibujarRuleta();

    // guardar duración al cerrar dialog si cambió
    btnSaveDur.addEventListener("click", ()=>{
      // ya manejado arriba
    });

    window.addEventListener("storage", (e) => {
      if (e.key === STORAGE_KEY) {
        loadParticipantsFromStorage();
        sorteadosSession = new Set();
        rebuildEditor();
        actualizarGeometria();
        dibujarRuleta();
      } else if (e.key === STORAGE_DURACION) {
        duracionMin = parseInt(localStorage.getItem(STORAGE_DURACION) || DEFAULT_DURATION);
        durInput.value = duracionMin;
      }
    });
    // ID: 20250926-1048.2
    // --- Batería Timer ---
    let batteryTotalSecs = duracionMin * 60;
    let batteryRemaining = batteryTotalSecs;
    const batteryLevel = document.getElementById("battery-level");
    const timerText = document.getElementById("timer-text");

    function updateBattery() {
      const percent = (batteryRemaining / batteryTotalSecs) * 100;
      batteryLevel.style.height = percent + "%";

      // Colores según nivel
      if (percent > 50) {
        batteryLevel.style.backgroundColor = "limegreen";
      } else if (percent > 10) {
        batteryLevel.style.backgroundColor = "gold";
      } else {
        batteryLevel.style.backgroundColor = "red";
      }

      // Mostrar mm:ss
      const minutes = Math.floor(batteryRemaining / 60);
      const seconds = batteryRemaining % 60;
      timerText.textContent = `${minutes}:${seconds.toString().padStart(2, "0")}`;
    }

    function startBatteryTimer() {
      updateBattery();
      const interval = setInterval(() => {
        if (batteryRemaining > 0) {
          batteryRemaining--;
          updateBattery();
        } else {
          clearInterval(interval);
          timerText.textContent = "⏰";
        }
      }, 1000);
    }

    // enganchar al inicio de la reunión
    const oldStartTimers = startTimers;
    startTimers = function() {
      oldStartTimers();
      batteryTotalSecs = duracionMin * 60;
      batteryRemaining = batteryTotalSecs;
      startBatteryTimer();
    };

    // mostrar valor inicial al cargar la página
    updateBattery();
  </script>
  </body>
</html>
